<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Time">
<meta name="theme-color" content="#990000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Time Recorder</title>
<style>
  /* ---------- mobile (light) ---------- */
  :root {
    --bg: #f5f5f3; --surface: #ffffff; --surface2: #f1f2f4; --line: #e3e5e8;
    --ink: #1f2328; --muted: #6b7178; --input: #ffffff; --input-line: #cfd3d8;
    --accent: #990000; --accent-ink: #990000; --accent-soft: #f6e9e9;
    --active: #2e7d4f; --active-soft: #e5f2ea; --done: #8a8f96; --done-soft: #eef0f2;
    --warn: #b26a00; --shadow: none; --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; background: var(--surface2); color: var(--ink); }
  button.primary { background: var(--accent); color: #fff; }
  button.go { background: var(--active); color: #fff; }
  button.ghost { background: transparent; color: var(--accent-ink); padding: 6px 4px; }
  button.danger { background: transparent; color: var(--accent-ink); border: 1px solid var(--accent-ink); }
  button.sm { padding: 6px 10px; font-size: 14px; }
  button.big { font-size: 19px; padding: 15px; font-weight: 600; width: 100%; }
  button.icon { background: transparent; font-size: 20px; padding: 4px 8px; color: var(--muted); }
  input, select, textarea { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid var(--input-line);
    border-radius: 8px; background: var(--input); color: var(--ink); }
  textarea { min-height: 54px; resize: vertical; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .4px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .hidden { display: none !important; }
  .desk-only { display: none; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }

  /* header + tabs */
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(8px + env(safe-area-inset-top)) 14px 0; }
  .hbar { display: flex; align-items: center; gap: 10px; }
  .hbar h1 { font-size: 19px; margin: 0; color: var(--accent-ink); flex: 1; letter-spacing: .2px; }
  #status { font-size: 12px; color: var(--muted); }
  #status.warn { color: var(--warn); }
  .tabs { display: flex; background: var(--surface2); border-radius: 10px; padding: 3px; margin: 8px 0 10px; }
  .tabs button { flex: 1; background: transparent; padding: 8px 4px; font-size: 15px; color: var(--muted); border-radius: 8px; }
  .tabs button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .layout { padding: 0 14px calc(24px + env(safe-area-inset-bottom)); max-width: 680px; margin: 0 auto; }
  body[data-tab="timer"] #side, body[data-tab="timer"] #panel,
  body[data-tab="jobs"] #main, body[data-tab="jobs"] #panel,
  body[data-tab="entries"] #side, body[data-tab="entries"] #main { display: none; }

  /* jobs list */
  .colhead { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 10px; }
  .colhead h3 { margin: 0; font-size: 15px; }
  .chips { display: flex; gap: 6px; margin-bottom: 10px; }
  .chip { padding: 5px 12px; border-radius: 20px; background: var(--surface2); font-size: 13px; cursor: pointer; color: var(--muted); }
  .chip.on { background: var(--ink); color: var(--bg); }
  .jobitem { display: flex; align-items: stretch; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 8px; overflow: hidden; cursor: pointer; }
  .jobitem .bar { width: 5px; background: var(--active); flex: none; }
  .jobitem.complete .bar { background: var(--done); }
  .jobitem.complete { opacity: .8; }
  .jobitem.all .bar { background: transparent; }
  .jobitem .body { flex: 1; padding: 9px 12px; display: flex; justify-content: space-between; gap: 10px; }
  .jobitem .name { font-weight: 600; }
  .jobitem .fig { text-align: right; white-space: nowrap; }
  .jobitem .fig b { display: block; }
  .jobitem.on { border-color: var(--accent-ink); box-shadow: 0 0 0 1px var(--accent-ink) inset; }

  /* timer */
  .clock { font-size: 52px; font-weight: 300; text-align: center; font-variant-numeric: tabular-nums; margin: 4px 0; letter-spacing: 1px; }
  .clock.paused { color: var(--warn); }
  .timer-run { text-align: center; }
  .timer-run h2 { margin: 2px 0 0; font-size: 19px; }
  .inline-time { width: auto; padding: 3px 6px; font-size: 14px; display: inline-block; }
  .taskchange { text-align: left; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }

  /* dashboard */
  .jobhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .jobhead h2 { margin: 0; font-size: 21px; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 10px; background: var(--active-soft); color: var(--active); }
  .pill.complete { background: var(--done-soft); color: var(--done); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .stat { background: var(--surface2); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 21px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
  .actions .spacer { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); padding: 4px; }
  td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.r, th.r { text-align: right; white-space: nowrap; }
  .timer-idle .big { margin-top: 14px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--active); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .tile b { display: block; font-size: 18px; margin-top: 4px; }

  /* entries */
  .day { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .4px; margin: 14px 2px 6px; }
  .entry { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 6px;
    cursor: pointer; display: flex; gap: 10px; }
  .entry:hover { border-color: var(--muted); }
  .entry .t { white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 14px; min-width: 92px; }
  .entry .d { flex: 1; min-width: 0; }
  .entry .d div { overflow: hidden; text-overflow: ellipsis; }
  .entry .v { text-align: right; white-space: nowrap; font-size: 14px; font-variant-numeric: tabular-nums; }
  .entry.live { border-color: var(--active); border-style: dashed; cursor: default; }
  .entry .job { font-size: 12px; color: var(--muted); }
  .editor { background: var(--surface); border: 1px solid var(--accent-ink); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
  .calc { margin-top: 10px; padding: 9px 10px; background: var(--surface2); border-radius: 8px; font-size: 14px; }
  .taskrow { display: flex; gap: 6px; } .taskrow select { flex: 1; min-width: 0; } .taskrow button { flex: none; padding: 6px 10px; }
  .editbox { margin-top: 8px; padding: 10px; border: 1px dashed var(--line); border-radius: 8px; text-align: left; }
  .splitbox { margin-top: 10px; padding: 10px; border: 1px dashed var(--line); border-radius: 8px; }

  /* modal + toast */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; overflow-y: auto;
    padding: calc(24px + env(safe-area-inset-top)) 10px 40px; }
  .modal { max-width: 520px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .modal h2 { margin: 0 0 4px; font-size: 19px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom));
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px; z-index: 30;
    max-width: 90%; text-align: center; }

  /* ---------- desktop (dark, three columns) ---------- */
  @media (min-width: 1000px) {
    :root {
      --bg: #0e1014; --surface: #171a20; --surface2: #1f232b; --line: #2a2f39;
      --ink: #e9ebef; --muted: #9098a5; --input: #12151a; --input-line: #323846;
      --accent: #b3202c; --accent-ink: #e25563; --accent-soft: #2a1619;
      --active: #34c47c; --active-soft: #12291d; --done: #6f7683; --done-soft: #20242b;
      color-scheme: dark;
      --warn: #f0a33a; --shadow: 0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35); --radius: 16px;
    }
    html, body { height: 100%; overflow: hidden; }
    header { padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--bg); }
    .hbar h1 { font-size: 18px; letter-spacing: .5px; }
    .tabs { display: none; }
    .desk-only { display: inline-block; }
    .layout { display: grid; grid-template-columns: 290px minmax(0, 1fr) 440px; max-width: none; padding: 0; height: calc(100vh - 57px); }
    .layout > * { display: block !important; overflow-y: auto; padding: 20px; }
    #side { border-right: 1px solid var(--line); background: #111318; }
    #panel { border-left: 1px solid var(--line); background: #111318; }
    #main { padding: 24px 32px; }
    .jobitem { background: transparent; border-color: transparent; }
    .jobitem:hover { background: var(--surface); }
    .jobitem.on { background: var(--surface); border-color: var(--line); box-shadow: none; }
    .jobitem.on .name { color: #fff; }
    .card { padding: 20px; }
    .clock { font-size: 76px; font-weight: 200; }
    .timer-run h2 { font-size: 22px; }
    .stats { grid-template-columns: repeat(4, 1fr); }
    .stat { padding: 14px 16px; border: 1px solid var(--line); }
    .stat b { font-size: 26px; font-weight: 500; }
    .tiles { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .timer-idle { display: grid; grid-template-columns: 1fr 1fr auto; gap: 14px; align-items: end; }
    .timer-idle label { margin-top: 0; }
    .timer-idle .big { width: auto; padding: 11px 34px; }
    .timer-idle { align-items: start; } .timer-idle .big { margin-top: 21px; }
    .entry { background: var(--surface); }
    button { transition: filter .15s; }
    button:hover { filter: brightness(1.15); }
    ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: #2a2f39; border-radius: 6px; }
  }
</style>
</head>
<body data-tab="timer">
<header>
  <div class="hbar"><h1>Time Recorder</h1><span id="status"></span><button class="sm desk-only" id="miniBtn" title="Open a small window that stays on top" onclick="openMini()">⧉ Mini</button><button class="icon" title="Settings" onclick="settingsForm()">⚙︎</button></div>
  <div class="tabs">
    <button data-tab="timer" onclick="setTab('timer')">Timer</button>
    <button data-tab="jobs" onclick="setTab('jobs')">Jobs</button>
    <button data-tab="entries" onclick="setTab('entries')">Entries</button>
  </div>
</header>
<div class="layout">
  <aside id="side"></aside>
  <main id="main"></main>
  <section id="panel"></section>
</div>
<div id="modal"></div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HRbcEY3paR5kCin9bYeBCqRbG0cAtp2a__8Ks6IQJls/edit';

// ---------- storage ----------
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let cfg = ls.get('tr_cfg', { url: '', key: '' });
let data = ls.get('tr_data', { jobs: [], sessions: [], running: null, defaultRate: 65 });
let queue = ls.get('tr_queue', []);
let pick = ls.get('tr_pick', { jobId: '', task: '', newTask: '' });
let sel = ls.get('tr_sel', '');
let tab = ls.get('tr_tab', 'timer');
let jobFilter = ls.get('tr_filter', 'active');
let editId = null, splitOpen = false, taskChange = false, runEdit = false, editOld = '';

const saveData = () => ls.set('tr_data', data);
const saveQueue = () => ls.set('tr_queue', queue);

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const money = n => '£' + (Number(n) || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hrs = h => (Number(h) || 0).toFixed(2) + ' h';
const hm = min => { min = Math.round(min || 0); return Math.floor(min / 60) + 'h ' + pad(min % 60) + 'm'; };
const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dayLabel = d => d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const jobById = id => data.jobs.find(j => j.id === id);
const isDesk = () => matchMedia('(min-width: 1000px)').matches;
const byStart = (a, b) => new Date(a.start) - new Date(b.start);
const activeJobs = () => data.jobs.filter(j => j.status !== 'Complete').sort((a, b) => a.name.localeCompare(b.name));

function derive(s) {
  const worked = Math.max(0, Math.round((new Date(s.end) - new Date(s.start)) / 60000 - (Number(s.pausedMin) || 0)));
  const charged = Math.ceil(worked / 15) * 15 / 60;
  return Object.assign({}, s, { workedMin: worked, chargedH: charged, charge: charged * (Number(s.rate) || 0) });
}

function tasksFor(jobId) {
  const seen = new Set(), out = [];
  data.sessions.filter(s => s.jobId === jobId).sort((a, b) => byStart(b, a))
    .forEach(s => { if (s.task && !seen.has(s.task)) { seen.add(s.task); out.push(s.task); } });
  if (data.running && data.running.jobId === jobId && data.running.task && !seen.has(data.running.task)) out.unshift(data.running.task);
  return out;
}

function taskOptions(jobId, selected) {
  const tasks = tasksFor(jobId);
  if (selected && selected !== '__new' && !tasks.includes(selected)) tasks.unshift(selected);
  return tasks.map(t => `<option ${t === selected ? 'selected' : ''}>${esc(t)}</option>`).join('') +
    `<option value="__new" ${selected === '__new' || !tasks.length ? 'selected' : ''}>+ New task…</option>`;
}
function readTask(selId, newId) {
  const v = $(selId).value;
  const t = v === '__new' ? $(newId).value.trim() : v;
  return t || 'General';
}

function totals(jobId) {
  const ss = data.sessions.filter(s => !jobId || s.jobId === jobId);
  return { n: ss.length, worked: ss.reduce((a, s) => a + s.workedMin, 0),
    charged: ss.reduce((a, s) => a + s.chargedH, 0), charge: ss.reduce((a, s) => a + s.charge, 0) };
}

function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
function setStatus(msg, cls) { const s = $('#status'); s.textContent = msg || ''; s.className = cls || ''; }

// ---------- sync ----------
function applyLocal(op) {
  if (op.type === 'saveJob') {
    const i = data.jobs.findIndex(j => j.id === op.job.id);
    if (i >= 0) data.jobs[i] = Object.assign({}, data.jobs[i], op.job); else data.jobs.push(Object.assign({ created: new Date().toISOString() }, op.job));
  } else if (op.type === 'deleteJob') {
    data.jobs = data.jobs.filter(j => j.id !== op.id);
    data.sessions = data.sessions.filter(s => s.jobId !== op.id);
  } else if (op.type === 'saveSession') {
    const s = derive(op.session);
    const i = data.sessions.findIndex(x => x.id === s.id);
    if (i >= 0) data.sessions[i] = s; else data.sessions.push(s);
  } else if (op.type === 'deleteSession') {
    data.sessions = data.sessions.filter(s => s.id !== op.id);
  } else if (op.type === 'setRunning') {
    data.running = op.running;
  } else if (op.type === 'setDefaultRate') {
    data.defaultRate = op.rate;
  }
}

function commit(...ops) {
  ops.forEach(op => { applyLocal(op); queue.push(op); });
  saveQueue(); saveData(); render(true); sync();
}

let syncing = false, again = false;
async function sync() {
  if (!cfg.url || !cfg.key) { setStatus('Not connected', 'warn'); return; }
  if (syncing) { again = true; return; }
  syncing = true; setStatus('Saving…');
  const sent = queue.slice();
  try {
    const r = await fetch(cfg.url, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: cfg.key, ops: sent })
    });
    const res = await r.json();
    if (!res.ok) throw new Error(res.error || 'Error');
    queue = queue.slice(sent.length); saveQueue();
    data = { jobs: res.jobs, sessions: res.sessions, running: res.running, defaultRate: res.defaultRate };
    queue.forEach(applyLocal);
    saveData();
    setStatus(queue.length ? queue.length + ' waiting' : 'Up to date');
  } catch (e) {
    setStatus(queue.length ? queue.length + ' change(s) waiting · offline' : 'Offline', 'warn');
    if (String(e.message).includes('key')) toast(e.message);
  }
  syncing = false;
  render();
  if (again) { again = false; sync(); }
}

// ---------- timer ----------
function elapsedMs(r, now) {
  now = now || Date.now();
  const paused = (r.pausedMs || 0) + (r.pauseStart ? now - new Date(r.pauseStart) : 0);
  return Math.max(0, now - new Date(r.start) - paused);
}
const fmtClock = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); };

function runningToSession(r) {
  const end = r.pauseStart ? new Date(r.pauseStart) : new Date();
  const job = jobById(r.jobId);
  return { id: uid('s'), jobId: r.jobId, task: r.task, start: r.start, end: end.toISOString(),
    pausedMin: Math.round((r.pausedMs || 0) / 6000) / 10, rate: job ? job.rate : data.defaultRate, notes: '' };
}

function startTimer() {
  const jobId = $('#tJob').value;
  if (!jobId) return toast('Choose a job first');
  const task = readTask('#tTask', '#tNew');
  pick = { jobId, task, newTask: '' }; ls.set('tr_pick', pick);
  commit({ type: 'setRunning', running: { jobId, task, start: new Date().toISOString(), pausedMs: 0, pauseStart: null } });
}

function pauseTimer() {
  const r = Object.assign({}, data.running);
  if (r.pauseStart) { r.pausedMs = (r.pausedMs || 0) + (Date.now() - new Date(r.pauseStart)); r.pauseStart = null; }
  else r.pauseStart = new Date().toISOString();
  commit({ type: 'setRunning', running: r });
}

function stopTimer() {
  if (!data.running) return;
  const s = runningToSession(data.running), d = derive(s);
  taskChange = false;
  if (elapsedMs(data.running) < 60000) { commit({ type: 'setRunning', running: null }); return toast('Under a minute, so not saved'); }
  commit({ type: 'saveSession', session: s }, { type: 'setRunning', running: null });
  toast('Saved ' + hm(d.workedMin) + ' → ' + hrs(d.chargedH) + ' · ' + money(d.charge));
}

function discardTimer() {
  if (confirm('Discard this timer without saving?')) { taskChange = false; commit({ type: 'setRunning', running: null }); }
}

function adjustStart(val) {
  if (!val) return;
  const r = Object.assign({}, data.running);
  const [h, m] = val.split(':').map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  if (d > new Date()) d.setDate(d.getDate() - 1);
  r.start = d.toISOString();
  commit({ type: 'setRunning', running: r });
}

function changeTask(mode) {
  const r = data.running; if (!r) return;
  const task = readTask('#cTask', '#cNew');
  taskChange = false;
  if (mode === 'now' && elapsedMs(r) < 60000) mode = 'whole';   // under a minute: just rename it
  if (mode === 'now') {
    // close the current entry and carry on timing under the new task
    const s = runningToSession(r);
    commit({ type: 'saveSession', session: s },
      { type: 'setRunning', running: { jobId: r.jobId, task, start: new Date().toISOString(), pausedMs: 0, pauseStart: null } });
    toast('Switched to ' + task);
  } else {
    commit({ type: 'setRunning', running: Object.assign({}, r, { task }) });
  }
  pick.task = task; ls.set('tr_pick', pick);
}

// ---------- navigation ----------
function setTab(t) {
  tab = t; ls.set('tr_tab', t); document.body.dataset.tab = t;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  render();
  if (t === 'entries' && !isDesk()) setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 0);
  else window.scrollTo(0, 0);
}

function selectJob(id) {
  sel = id; ls.set('tr_sel', id); editId = null; splitOpen = false;
  const j = jobById(id);
  if (j && j.status !== 'Complete' && !data.running) { pick.jobId = id; pick.task = tasksFor(id)[0] || '__new'; ls.set('tr_pick', pick); }
  if (!isDesk() && tab === 'jobs') setTab('timer'); else render();
}

// ---------- render ----------
function render(force) {
  if ($('#modal').innerHTML) { renderMini(); return; }
  $('#side').innerHTML = sideHTML();
  $('#main').innerHTML = mainHTML();
  if (!editId || force === 'panel') renderPanel();
  renderMini();
  tick();
}

function renderPanel() {
  const p = $('#panel');
  p.innerHTML = panelHTML();
  if (editId) {
    const ed = $('#editor'); if (ed) ed.scrollIntoView({ block: 'nearest' });
    if ($('#eTask')) eTaskChanged(), eCalc();
  } else if (isDesk()) p.scrollTop = p.scrollHeight;
}

function sideHTML() {
  let jobs = data.jobs.slice();

  const all = totals('');
  return `<div class="colhead"><h3>Jobs</h3><button class="primary sm" onclick="jobForm()">+ New job</button></div>
    <div class="chips">
      <span class="chip ${jobFilter === 'active' ? 'on' : ''}" onclick="setFilter('active')">Active</span>

    <div class="jobitem all ${!sel ? 'on' : ''}" onclick="selectJob('')"><div class="bar"></div><div class="body">
      <div><div class="name">All jobs</div><div class="muted small">Recent entries</div></div>
      <div class="fig"><b>${money(all.charge)}</b><span class="muted small">${hrs(all.charged)}</span></div></div></div>` +

      <div class="bar"></div><div class="body">
        <div><div class="name">${esc(j.name)}</div><div class="muted small">${esc(j.client || '')}${j.client ? ' · ' : ''}${money(j.rate)}/h</div></div>
        <div class="fig"><b>${money(t.charge)}</b><span class="muted small">${hrs(t.charged)}</span></div>
      </div></div>`; }).join('');
}
function setFilter(f) { jobFilter = f; ls.set('tr_filter', f); render(); }

function mainHTML() { return timerHTML() + (sel && jobById(sel) ? jobDashHTML(sel) : overviewHTML()); }

function timerHTML() {

    const job = jobById(r.jobId);
    return `<div class="card timer-run">

function pickJob(id) { pick.jobId = id; pick.task = tasksFor(id)[0] || '__new'; pick.newTask = ''; ls.set('tr_pick', pick); sel = id; ls.set('tr_sel', id); editId = null; render(true); }
function pickTask(v) { pick.task = v; ls.set('tr_pick', pick); $('#tNew').classList.toggle('hidden', v !== '__new'); if (v === '__new') $('#tNew').focus(); }

function overviewHTML() {
  const act = activeJobs();

  const tw = data.sessions.filter(s => { const d = new Date(s.start), n = new Date(); return (n - d) < 7 * 864e5; });

      <span class="muted small">Last 7 days: ${hrs(tw.reduce((a, s) => a + s.chargedH, 0))} · ${money(tw.reduce((a, s) => a + s.charge, 0))}</span></div>
    <div class="tiles">${act.map(j => { const t = totals(j.id); return `<div class="tile" onclick="selectJob('${j.id}')">

      <b>${money(t.charge)}</b><span class="muted small">${hrs(t.charged)} · ${t.n} entries</span></div>`; }).join('')}</div></div>`;

function toggleStatus(id) {
  const j = Object.assign({}, jobById(id));
  j.status = j.status === 'Complete' ? 'Active' : 'Complete';
  commit({ type: 'saveJob', job: j });
}

// ---------- entries panel ----------
function panelHTML() {
  const j = sel ? jobById(sel) : null;
  let list = data.sessions.filter(s => !j || s.jobId === j.id).sort(byStart);
  if (!j) list = list.slice(-60);
  let html = `<div class="colhead"><div><h3>${j ? esc(j.name) : 'Recent entries'}</h3>
      ${j && !isDesk() ? `<span class="chip" onclick="selectJob('')">Show all jobs</span>` : ''}</div>
    <button class="go sm" onclick="newEntry()">+ Add entry</button></div>`;
  if (!list.length && !data.running && editId !== 'new') html += '<p class="muted small">No entries yet.</p>';
  let day = '';
  list.forEach(s => {
    const a = new Date(s.start), b = new Date(s.end);
    if (ymd(a) !== day) {
      day = ymd(a);
      const dt = list.filter(x => ymd(new Date(x.start)) === day);
      html += `<div class="day"><span>${dayLabel(a)}</span><span>${hrs(dt.reduce((t, x) => t + x.chargedH, 0))}</span></div>`;
    }
    if (editId === s.id) { html += editorHTML(s); return; }
    html += `<div class="entry" onclick="openEntry('${s.id}')">
      <div class="t">${hhmm(a)}–${hhmm(b)}</div>
      <div class="d">${!j ? `<div class="job">${esc((jobById(s.jobId) || {}).name || '')}</div>` : ''}<div>${esc(s.task)}</div>
        ${s.notes ? `<div class="muted small">${esc(s.notes)}</div>` : ''}</div>
      <div class="v">${hrs(s.chargedH)}<div class="muted small">${money(s.charge)}</div></div></div>`;
  });
  const r = data.running;
  if (r && (!j || r.jobId === j.id)) {
    const a = new Date(r.start);
    if (ymd(a) !== day) html += `<div class="day"><span>${dayLabel(a)}</span><span></span></div>`;
    html += `<div class="entry live"><div class="t">${hhmm(a)}–now</div>
      <div class="d">${!j ? `<div class="job">${esc((jobById(r.jobId) || {}).name || '')}</div>` : ''}<div>${esc(r.task)}</div></div>
      <div class="v" id="liveDur">${r.pauseStart ? 'paused' : 'running'}</div></div>`;
  }
  if (editId === 'new') html += editorHTML(null);
  return html;
}

function openEntry(id) { editId = id; splitOpen = false; renderPanel(); }
function newEntry() { editId = 'new'; splitOpen = false; if (!isDesk() && tab !== 'entries') setTab('entries'); renderPanel(); }
function cancelEdit() { editId = null; splitOpen = false; renderPanel(); }

function editorHTML(s) {
  const jobs = data.jobs.slice().sort((a, b) => (a.status === 'Complete') - (b.status === 'Complete') || a.name.localeCompare(b.name));
  if (!jobs.length) return `<div class="editor"><p class="muted">Create a job first.</p><button class="sm" onclick="cancelEdit()">Close</button></div>`;
  const jobId = s ? s.jobId : (sel || pick.jobId || jobs[0].id);
  const job = jobById(jobId) || jobs[0];
  const now = new Date();
  const start = s ? new Date(s.start) : new Date(now.getTime() - 3600000), end = s ? new Date(s.end) : now;
  const mid = new Date((start.getTime() + end.getTime()) / 2);
  return `<div class="editor" id="editor">
    <div class="row">
      <div><label>Job</label><select id="eJob" onchange="eJobChanged()">${jobs.map(x => `<option value="${esc(x.id)}" ${x.id === job.id ? 'selected' : ''}>${esc(x.name)}${x.status === 'Complete' ? ' (complete)' : ''}</option>`).join('')}</select></div>
      <div><label>Task</label><div class="taskrow"><select id="eTask" onchange="eTaskChanged()">${taskOptions(job.id, s ? s.task : (tasksFor(job.id)[0] || '__new'))}</select>
        <button title="Edit task text" onclick="eEditOpen()">✎</button></div></div>
    </div>
    <input id="eNew" class="hidden" style="margin-top:8px" placeholder="New task">
    <div id="eEdit" class="editbox hidden">
      <label>Task text</label><input id="eTxt">
      <div class="actions"><button class="primary sm" onclick="eRename(false)">This entry only</button>
        <button class="sm" id="eAllBtn" onclick="eRename(true)">Rename everywhere</button>
        <span class="spacer"></span><button class="ghost sm" onclick="$('#eEdit').classList.add('hidden')">Cancel</button></div>
    </div>
    <div class="row">
      <div><label>Date</label><input id="eDate" type="date" value="${ymd(start)}" oninput="eCalc()"></div>
      <div><label>Start</label><input id="eStart" type="time" value="${hhmm(start)}" oninput="eCalc()"></div>
      <div><label>End</label><input id="eEnd" type="time" value="${hhmm(end)}" oninput="eCalc()"></div>
    </div>
    <div class="row">
      <div><label>Paused (min)</label><input id="ePaused" type="number" min="0" step="1" inputmode="numeric" value="${s ? Math.round(s.pausedMin) : 0}" oninput="eCalc()"></div>
      <div><label>Rate (£/h)</label><input id="eRate" type="number" step="0.01" inputmode="decimal" value="${s ? s.rate : job.rate}" oninput="eCalc()"></div>
    </div>
    <label>Notes</label><textarea id="eNotes">${esc(s ? s.notes : '')}</textarea>
    <div class="calc" id="eCalc"></div>
    ${s && splitOpen ? `<div class="splitbox">
      <div class="row">
        <div><label>Split at</label><input id="sAt" type="time" value="${hhmm(mid)}"></div>
        <div><label>Task after split</label><select id="sTask" onchange="$('#sNew').classList.toggle('hidden', this.value!=='__new')">${taskOptions(job.id, '__new')}</select></div>
      </div>
      <input id="sNew" style="margin-top:8px" placeholder="New task">
      <div class="actions"><button class="go sm" onclick="doSplit()">Split entry</button>
        <button class="ghost sm" onclick="splitOpen=false;renderPanel()">Cancel split</button></div>
      <div class="muted small">The first part keeps this entry's task. Paused time is shared in proportion.</div>
    </div>` : ''}
    <div class="actions">
      ${s ? `<button class="danger sm" onclick="deleteEntry('${s.id}')">Delete</button>
             ${splitOpen ? '' : `<button class="sm" onclick="splitOpen=true;renderPanel()">Split…</button>`}` : ''}
      <span class="spacer"></span>
      <button class="sm" onclick="cancelEdit()">Cancel</button>
      <button class="primary sm" onclick="saveEntry()">Save</button>
    </div>
  </div>`;
}

function countTask(jobId, task) { return data.sessions.filter(s => s.jobId === jobId && s.task === task).length; }

// rename a task on every entry of a job (and the running timer)
function renameOps(jobId, oldT, newT) {
  const ops = data.sessions.filter(s => s.jobId === jobId && s.task === oldT)
    .map(s => ({ type: 'saveSession', session: { id: s.id, jobId: s.jobId, task: newT, start: s.start, end: s.end, pausedMin: s.pausedMin, rate: s.rate, notes: s.notes } }));
  const r = data.running;
  if (r && r.jobId === jobId && r.task === oldT) ops.push({ type: 'setRunning', running: Object.assign({}, r, { task: newT }) });
  if (pick.jobId === jobId && pick.task === oldT) { pick.task = newT; ls.set('tr_pick', pick); }
  return ops;
}

function runRename(all) {
  const r = data.running, t = $('#rTxt').value.trim();
  if (!r || !t) return;
  runEdit = false;
  if (all) { const ops = renameOps(r.jobId, r.task, t); if (!ops.some(o => o.type === 'setRunning')) ops.push({ type: 'setRunning', running: Object.assign({}, r, { task: t }) }); commit(...ops); toast('Renamed everywhere'); }
  else commit({ type: 'setRunning', running: Object.assign({}, r, { task: t }) });
}

function eEditOpen() {
  const v = $('#eTask').value;
  editOld = v === '__new' ? '' : v;
  $('#eTxt').value = v === '__new' ? $('#eNew').value : v;
  const n = editOld ? countTask($('#eJob').value, editOld) : 0;
  $('#eAllBtn').textContent = 'Rename everywhere (' + n + ' entries)';
  $('#eAllBtn').classList.toggle('hidden', !editOld);
  $('#eEdit').classList.remove('hidden'); $('#eTxt').focus();
}

function eRename(all) {
  const t = $('#eTxt').value.trim(); if (!t) return;
  const jobId = $('#eJob').value;
  if (all && editOld && t !== editOld) {
    const ops = renameOps(jobId, editOld, t);
    commit(...ops);
    toast('Renamed in ' + ops.filter(o => o.type === 'saveSession').length + ' entries');
  }
  $('#eTask').innerHTML = taskOptions(jobId, t);
  $('#eEdit').classList.add('hidden'); eTaskChanged();
}

function eJobChanged() {
  const j = jobById($('#eJob').value);
  $('#eTask').innerHTML = taskOptions(j.id, tasksFor(j.id)[0] || '__new');
  if (editId === 'new') $('#eRate').value = j.rate;
  eTaskChanged(); eCalc();
}
function eTaskChanged() { $('#eNew').classList.toggle('hidden', $('#eTask').value !== '__new'); }

function eTimes() {
  const date = $('#eDate').value, st = $('#eStart').value, en = $('#eEnd').value;
  if (!date || !st || !en) return null;
  const [y, mo, d] = date.split('-').map(Number);
  const [sh, sm] = st.split(':').map(Number), [eh, em] = en.split(':').map(Number);
  let start = new Date(y, mo - 1, d, sh, sm), end = new Date(y, mo - 1, d, eh, em);
  if (end <= start) end.setDate(end.getDate() + 1);           // runs past midnight
  const orig = editId !== 'new' && data.sessions.find(x => x.id === editId);
  if (orig) {                                                  // keep exact seconds if unchanged
    const os = new Date(orig.start), oe = new Date(orig.end);
    if (ymd(os) === date && hhmm(os) === st) start = os;
    if (hhmm(oe) === en && Math.abs(oe - end) < 60000) end = oe;
  }
  return { start, end };
}

function eCalc() {
  const t = eTimes(); if (!t) return;
  const d = derive({ start: t.start, end: t.end, pausedMin: parseFloat($('#ePaused').value) || 0, rate: parseFloat($('#eRate').value) || 0 });
  $('#eCalc').innerHTML = `Worked ${hm(d.workedMin)} → charged <b>${hrs(d.chargedH)}</b> = <b>${money(d.charge)}</b>`;
}

function eSession() {
  const t = eTimes(); if (!t) { toast('Enter the date and times'); return null; }
  return { id: editId === 'new' ? uid('s') : editId, jobId: $('#eJob').value, task: readTask('#eTask', '#eNew'),
    start: t.start.toISOString(), end: t.end.toISOString(), pausedMin: parseFloat($('#ePaused').value) || 0,
    rate: parseFloat($('#eRate').value) || 0, notes: $('#eNotes').value.trim() };
}

function saveEntry() {
  const s = eSession(); if (!s) return;
  editId = null; splitOpen = false;
  commit({ type: 'saveSession', session: s });
  toast('Saved');
}

function doSplit() {
  const s = eSession(); if (!s) return;
  const a = new Date(s.start), b = new Date(s.end);
  const [h, m] = $('#sAt').value.split(':').map(Number);
  let at = new Date(a); at.setHours(h, m, 0, 0);
  if (at <= a) at.setDate(at.getDate() + 1);
  if (!(at > a && at < b)) return toast('Split time must be between ' + hhmm(a) + ' and ' + hhmm(b));
  const d1 = at - a, d2 = b - at, p = s.pausedMin || 0;
  const p1 = Math.round(p * d1 / (d1 + d2) * 10) / 10;
  const first = Object.assign({}, s, { end: at.toISOString(), pausedMin: p1 });
  const second = Object.assign({}, s, { id: uid('s'), task: readTask('#sTask', '#sNew'), start: at.toISOString(),
    pausedMin: Math.round((p - p1) * 10) / 10, notes: '' });
  editId = null; splitOpen = false;
  commit({ type: 'saveSession', session: first }, { type: 'saveSession', session: second });
  toast('Split at ' + hhmm(at));
}

function deleteEntry(id) {
  if (!confirm('Delete this entry? This cannot be undone.')) return;
  editId = null;
  commit({ type: 'deleteSession', id });
}

// ---------- modals ----------

}

function saveJob(id) {
  const name = $('#jName').value.trim();
  if (!name) return toast('Enter a job name');
  const job = { id: id || uid('j'), name, client: $('#jClient').value.trim(), rate: parseFloat($('#jRate').value) || 0,
    status: $('#jStatus').value, notes: $('#jNotes').value.trim() };
  $('#modal').innerHTML = '';
  commit({ type: 'saveJob', job });
  if (!id) selectJob(job.id);
}

function deleteJob(id) {
  const j = jobById(id), n = totals(id).n;
  if (!confirm(`Delete "${j.name}"${n ? ' and its ' + n + ' entries' : ''}? This cannot be undone.\n\nTo keep the record, cancel and mark the job Complete instead.`)) return;
  $('#modal').innerHTML = '';
  if (sel === id) { sel = ''; ls.set('tr_sel', ''); }
  commit({ type: 'deleteJob', id });
}

function settingsForm() {
  openModal(`<h2>Settings</h2>
    <label>Apps Script web app URL</label><input id="sUrl" value="${esc(cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec">
    <label>Key</label><input id="sKey" value="${esc(cfg.key)}" autocomplete="off">
    <label>Default hourly rate for new jobs (£)</label><input id="sRate" type="number" step="0.01" inputmode="decimal" value="${data.defaultRate}">
    ${queue.length ? `<p class="small" style="color:var(--warn)">${queue.length} change(s) waiting to be sent.</p>` : ''}
    <p class="muted small">Data is kept in the <a style="color:var(--accent-ink)" href="${SHEET_URL}" target="_blank">Time Recorder sheet</a> on Google Drive.
      Each entry is charged in 15-minute blocks, rounded up. Paused time is not counted.</p>
    <div class="actions"><button class="sm" onclick="closeModal();sync()">Sync now</button><span class="spacer"></span>
      <button class="sm" onclick="closeModal()">Cancel</button><button class="primary sm" onclick="saveSettings()">Save</button></div>`);
}

function saveSettings() {
  cfg = { url: $('#sUrl').value.trim(), key: $('#sKey').value.trim() }; ls.set('tr_cfg', cfg);
  const rate = parseFloat($('#sRate').value);
  $('#modal').innerHTML = '';
  if (!isNaN(rate) && rate !== data.defaultRate) commit({ type: 'setDefaultRate', rate }); else { render(true); sync(); }
  toast('Settings saved');
}

// ---------- mini window (Document Picture-in-Picture, Chrome/Edge) ----------
let miniWin = null;
const MINI_CSS = `
  html,body{margin:0;height:100%;background:#171a20;color:#e9ebef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif}
  #m{height:100%;display:flex;flex-direction:column;justify-content:center;padding:10px 14px;box-sizing:border-box}
  .cl{color:#9098a5;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm{font-size:38px;font-weight:300;letter-spacing:1px;font-variant-numeric:tabular-nums;margin:0 0 8px}
  .tm.p{color:#f0a33a}.tm.idle{color:#6f7683}
  .bt{display:flex;gap:8px}
  button{flex:1;height:36px;border:0;border-radius:9px;font:inherit;font-size:14px;color:#fff;cursor:pointer}
  button:hover{filter:brightness(1.15)}
  .g{background:#2a2f39}.r{background:#b3202c}.gr{background:#34c47c;color:#0e1014;font-weight:600}
  .x{flex:0 0 40px;background:transparent;border:1px solid #323846;color:#9098a5;font-size:16px}`;

function pickReady() {
  const j = jobById(pick.jobId);
  if (!j || j.status === 'Complete') return null;
  const t = pick.task === '__new' ? (pick.newTask || '').trim() : pick.task;
  return t ? { jobId: j.id, task: t } : null;
}

async function openMini() {
  if (!('documentPictureInPicture' in window)) return toast('The mini window needs Chrome or Edge on a PC');
  if (miniWin) { miniWin.focus(); return; }
  try {
    miniWin = await documentPictureInPicture.requestWindow({ width: 300, height: 140 });
  } catch (e) { return toast('Could not open the mini window'); }
  const st = miniWin.document.createElement('style'); st.textContent = MINI_CSS;
  miniWin.document.head.append(st);
  miniWin.document.title = 'Time Recorder';
  miniWin.document.body.innerHTML = '<div id="m"></div>';
  miniWin.addEventListener('pagehide', () => { miniWin = null; });
  renderMini();
}

function expandFromMini() {
  if (miniWin) miniWin.close();
  miniWin = null;
  window.focus();
}

function miniStart() {
  const p = pickReady();
  if (!p) return expandFromMini();
  if (pick.task === '__new') { pick.task = p.task; pick.newTask = ''; ls.set('tr_pick', pick); }
  commit({ type: 'setRunning', running: { jobId: p.jobId, task: p.task, start: new Date().toISOString(), pausedMs: 0, pauseStart: null } });
}

function renderMini() {
  if (!miniWin) return;
  const m = miniWin.document.getElementById('m'); if (!m) return;
  const r = data.running;
  const job = jobById(r ? r.jobId : (pickReady() || {}).jobId);
  const who = job ? (job.client || job.name) : 'No job selected';
  m.innerHTML = `<div class="cl">${esc(who)}</div>
    <div class="tm ${!r ? 'idle' : r.pauseStart ? 'p' : ''}" id="mt">${r ? fmtClock(elapsedMs(r)) : '0:00:00'}</div>
    <div class="bt">${r
      ? `<button class="${r.pauseStart ? 'gr' : 'g'}" data-a="pause">${r.pauseStart ? '▶ Resume' : '❚❚ Pause'}</button><button class="r" data-a="stop">■ Stop</button>`
      : `<button class="gr" data-a="start">▶ Start</button>`}
      <button class="x" data-a="expand" title="Back to the full window">⤢</button></div>`;
  const act = { pause: pauseTimer, stop: stopTimer, start: miniStart, expand: expandFromMini };
  m.querySelectorAll('button').forEach(b => b.addEventListener('click', () => act[b.dataset.a]()));
}

// ---------- clock ----------
function tick() {
  const r = data.running; if (!r) return;
  if (miniWin) { const mt = miniWin.document.getElementById('mt'); if (mt) mt.textContent = fmtClock(elapsedMs(r)); }
  const c = $('#clock'); if (c) c.textContent = fmtClock(elapsedMs(r));
  const pausedMin = Math.round(((r.pausedMs || 0) + (r.pauseStart ? Date.now() - new Date(r.pauseStart) : 0)) / 60000);
  const sub = $('#clockSub');
  if (sub) sub.textContent = r.pauseStart ? 'Paused since ' + hhmm(new Date(r.pauseStart)) + (pausedMin ? ' · ' + pausedMin + ' min paused in total' : '')
    : (pausedMin ? pausedMin + ' min paused' : ' ');
  const live = $('#liveDur'); if (live) live.textContent = r.pauseStart ? 'paused' : hm(elapsedMs(r) / 60000);
}
setInterval(tick, 1000);

// ---------- start ----------
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
window.addEventListener('online', sync);
let wasDesk = isDesk();
window.addEventListener('resize', () => { if (isDesk() !== wasDesk) { wasDesk = isDesk(); render(true); } });
setTab(tab);
if (!('documentPictureInPicture' in window)) $('#miniBtn').remove();
if (!cfg.url || !cfg.key) settingsForm();
sync();
</script>
</body>
</html>
