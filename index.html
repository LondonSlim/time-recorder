<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Time">
<meta name="theme-color" content="#990000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Time Recorder</title>
<style>
  :root {
    --accent: #990000; --accent-soft: #f6e9e9;
    --active: #2e7d4f; --active-soft: #e5f2ea;
    --done: #8a8f96; --done-soft: #eef0f2;
    --ink: #1f2328; --muted: #6b7178; --line: #e3e5e8; --bg: #f7f7f5; --card: #fff;
    --warn: #b26a00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  body { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 12px 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 14px 6px; max-width: 640px; margin: 0 auto; }
  header h1 { font-size: 20px; margin: 0; color: var(--accent); letter-spacing: .2px; }
  #status { font-size: 12px; color: var(--muted); }
  #status.warn { color: var(--warn); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }
  input, select, textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid #cfd3d8;
    border-radius: 8px; background: #fff; color: var(--ink); }
  textarea { min-height: 60px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 11px 14px; cursor: pointer;
    background: #eceef0; color: var(--ink); }
  button.primary { background: var(--accent); color: #fff; }
  button.go { background: var(--active); color: #fff; }
  button.ghost { background: transparent; color: var(--accent); padding: 8px 4px; }
  button.danger { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.big { width: 100%; font-size: 20px; padding: 16px; margin-top: 14px; font-weight: 600; }
  .clock { font-size: 52px; font-weight: 300; text-align: center; font-variant-numeric: tabular-nums; margin: 6px 0; }
  .clock.paused { color: var(--warn); }
  .center { text-align: center; }
  .muted { color: var(--muted); font-size: 14px; }
  .small { font-size: 13px; }
  .job { display: flex; align-items: stretch; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 8px; overflow: hidden; cursor: pointer; }
  .job .bar { width: 6px; background: var(--active); flex: none; }
  .job.complete .bar { background: var(--done); }
  .job.complete { background: var(--done-soft); }
  .job .body { flex: 1; padding: 10px 12px; display: flex; justify-content: space-between; gap: 10px; }
  .job .name { font-weight: 600; }
  .job .fig { text-align: right; white-space: nowrap; }
  .job .fig b { display: block; }
  .chips { display: flex; gap: 6px; margin-bottom: 10px; }
  .chip { padding: 6px 12px; border-radius: 20px; background: #eceef0; font-size: 14px; }
  .chip.on { background: var(--ink); color: #fff; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); padding: 4px 4px; }
  td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.r, th.r { text-align: right; white-space: nowrap; }
  tr.click { cursor: pointer; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px;
    background: var(--active-soft); color: var(--active); }
  .pill.complete { background: var(--done-soft); color: var(--done); }
  h2 { font-size: 18px; margin: 0 0 4px; }
  h3 { font-size: 15px; margin: 4px 0 8px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line);
    display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav div { display: flex; max-width: 640px; width: 100%; }
  nav button { flex: 1; background: none; border-radius: 0; padding: 12px 4px; color: var(--muted); font-size: 14px; }
  nav button.on { color: var(--accent); font-weight: 600; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 10; overflow-y: auto;
    padding: calc(20px + env(safe-area-inset-top)) 10px 40px; }
  .modal { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 16px; }
  .actions { display: flex; gap: 10px; margin-top: 16px; align-items: center; }
  .actions .spacer { flex: 1; }
  .calc { margin-top: 12px; padding: 10px; background: var(--bg); border-radius: 8px; font-size: 14px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom));
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; z-index: 20;
    max-width: 90%; text-align: center; }
  .hidden { display: none !important; }
  .inline-time { width: auto; padding: 4px 6px; font-size: 14px; display: inline-block; }
</style>
</head>
<body>
<header><h1>Time Recorder</h1><span id="status"></span></header>
<div class="wrap" id="view"></div>
<nav><div>
  <button data-nav="timer">Timer</button>
  <button data-nav="jobs">Jobs</button>
  <button data-nav="add">+ Time</button>
  <button data-nav="settings">Settings</button>
</div></nav>
<div id="modal"></div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HRbcEY3paR5kCin9bYeBCqRbG0cAtp2a__8Ks6IQJls/edit';

// ---------- storage ----------
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let cfg = ls.get('tr_cfg', { url: '', key: '' });
let data = ls.get('tr_data', { jobs: [], sessions: [], running: null, defaultRate: 65 });
let queue = ls.get('tr_queue', []);
let pick = ls.get('tr_pick', { jobId: '', task: '', newTask: '' });
let view = ls.get('tr_view', 'timer');
let jobFilter = ls.get('tr_filter', 'active');

const saveData = () => ls.set('tr_data', data);
const saveQueue = () => ls.set('tr_queue', queue);

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const money = n => '£' + (Number(n) || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hrs = h => (Number(h) || 0).toFixed(2) + ' h';
const hm = min => { min = Math.round(min || 0); return Math.floor(min / 60) + 'h ' + pad(min % 60) + 'm'; };
const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dayLabel = d => d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const jobById = id => data.jobs.find(j => j.id === id);
const sameDay = (a, b) => ymd(a) === ymd(b);

function derive(s) {
  const worked = Math.max(0, Math.round((new Date(s.end) - new Date(s.start)) / 60000 - (Number(s.pausedMin) || 0)));
  const charged = Math.ceil(worked / 15) * 15 / 60;
  return Object.assign({}, s, { workedMin: worked, chargedH: charged, charge: charged * (Number(s.rate) || 0) });
}

function tasksFor(jobId) {
  const seen = new Set(), out = [];
  data.sessions.filter(s => s.jobId === jobId)
    .sort((a, b) => new Date(b.start) - new Date(a.start))
    .forEach(s => { if (s.task && !seen.has(s.task)) { seen.add(s.task); out.push(s.task); } });
  return out;
}

function totals(jobId) {
  const ss = data.sessions.filter(s => s.jobId === jobId);
  return {
    n: ss.length,
    worked: ss.reduce((a, s) => a + s.workedMin, 0),
    charged: ss.reduce((a, s) => a + s.chargedH, 0),
    charge: ss.reduce((a, s) => a + s.charge, 0)
  };
}

function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}

function setStatus(msg, cls) { const s = $('#status'); s.textContent = msg || ''; s.className = cls || ''; }

// ---------- sync ----------
function applyLocal(op) {
  if (op.type === 'saveJob') {
    const i = data.jobs.findIndex(j => j.id === op.job.id);
    if (i >= 0) data.jobs[i] = Object.assign({}, data.jobs[i], op.job); else data.jobs.push(Object.assign({ created: new Date().toISOString() }, op.job));
  } else if (op.type === 'deleteJob') {
    data.jobs = data.jobs.filter(j => j.id !== op.id);
    data.sessions = data.sessions.filter(s => s.jobId !== op.id);
  } else if (op.type === 'saveSession') {
    const s = derive(op.session);
    const i = data.sessions.findIndex(x => x.id === s.id);
    if (i >= 0) data.sessions[i] = s; else data.sessions.push(s);
  } else if (op.type === 'deleteSession') {
    data.sessions = data.sessions.filter(s => s.id !== op.id);
  } else if (op.type === 'setRunning') {
    data.running = op.running;
  } else if (op.type === 'setDefaultRate') {
    data.defaultRate = op.rate;
  }
}

function commit(...ops) {
  ops.forEach(op => { applyLocal(op); queue.push(op); });
  saveQueue(); saveData(); render(); sync();
}

let syncing = false, again = false;
async function sync() {
  if (!cfg.url || !cfg.key) { setStatus('Not connected', 'warn'); return; }
  if (syncing) { again = true; return; }
  syncing = true; setStatus('Saving…');
  const sent = queue.slice();
  try {
    const r = await fetch(cfg.url, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: cfg.key, ops: sent })
    });
    const res = await r.json();
    if (!res.ok) throw new Error(res.error || 'Error');
    queue = queue.slice(sent.length); saveQueue();
    data = { jobs: res.jobs, sessions: res.sessions, running: res.running, defaultRate: res.defaultRate };
    queue.forEach(applyLocal);
    saveData();
    setStatus(queue.length ? queue.length + ' waiting' : 'Up to date');
  } catch (e) {
    setStatus(queue.length ? queue.length + ' change(s) waiting · offline' : 'Offline', 'warn');
    if (String(e.message).includes('key')) toast(e.message);
  }
  syncing = false;
  if (!$('#modal').innerHTML) render();
  if (again) { again = false; sync(); }
}

// ---------- timer ----------
function elapsedMs(r, now) {
  now = now || Date.now();
  const paused = (r.pausedMs || 0) + (r.pauseStart ? now - new Date(r.pauseStart) : 0);
  return Math.max(0, now - new Date(r.start) - paused);
}
function fmtClock(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60);
}

function startTimer() {
  const jobId = $('#tJob').value;
  if (!jobId) return toast('Choose a job first');
  let task = $('#tTask').value === '__new' ? $('#tNew').value.trim() : $('#tTask').value;
  if (!task) task = 'General';
  pick = { jobId, task, newTask: '' }; ls.set('tr_pick', pick);
  commit({ type: 'setRunning', running: { jobId, task, start: new Date().toISOString(), pausedMs: 0, pauseStart: null } });
}

function pauseTimer() {
  const r = Object.assign({}, data.running);
  if (r.pauseStart) { r.pausedMs = (r.pausedMs || 0) + (Date.now() - new Date(r.pauseStart)); r.pauseStart = null; }
  else r.pauseStart = new Date().toISOString();
  commit({ type: 'setRunning', running: r });
}

function stopTimer() {
  const r = data.running; if (!r) return;
  const end = r.pauseStart ? new Date(r.pauseStart) : new Date();
  const job = jobById(r.jobId);
  const s = {
    id: uid('s'), jobId: r.jobId, task: r.task, start: r.start, end: end.toISOString(),
    pausedMin: Math.round((r.pausedMs || 0) / 6000) / 10, rate: job ? job.rate : data.defaultRate, notes: ''
  };
  const d = derive(s);
  commit({ type: 'saveSession', session: s }, { type: 'setRunning', running: null });
  toast('Saved ' + hm(d.workedMin) + ' → ' + hrs(d.chargedH) + ' · ' + money(d.charge));
}

function discardTimer() {
  if (confirm('Discard this timer without saving?')) commit({ type: 'setRunning', running: null });
}

function adjustStart(val) {
  if (!val) return;
  const r = Object.assign({}, data.running);
  const [h, m] = val.split(':').map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  if (d > new Date()) d.setDate(d.getDate() - 1);
  r.start = d.toISOString();
  commit({ type: 'setRunning', running: r });
}

// ---------- views ----------
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.nav === view.split(':')[0] || (b.dataset.nav === 'jobs' && view.startsWith('job:'))));
  const v = $('#view');
  if (view === 'timer') v.innerHTML = timerView();
  else if (view === 'jobs') v.innerHTML = jobsView();
  else if (view.startsWith('job:')) v.innerHTML = jobView(view.slice(4));
  else if (view === 'settings') v.innerHTML = settingsView();
  else { view = 'timer'; return render(); }
  tick();
}

function go(v) { view = v; ls.set('tr_view', v); render(); window.scrollTo(0, 0); }

function taskOptions(jobId, selected) {
  const tasks = tasksFor(jobId);
  let html = tasks.map(t => `<option ${t === selected ? 'selected' : ''}>${esc(t)}</option>`).join('');
  html += `<option value="__new" ${(selected === '__new' || !tasks.includes(selected)) ? 'selected' : ''}>+ New task…</option>`;
  return html;
}

function timerView() {
  const r = data.running;
  let html = '';
  if (r) {
    const job = jobById(r.jobId);
    html += `<div class="card center">
      <div class="muted">${esc(job ? job.name : 'Unknown job')}</div>
      <h2>${esc(r.task)}</h2>
      <div class="clock ${r.pauseStart ? 'paused' : ''}" id="clock">${fmtClock(elapsedMs(r))}</div>
      <div class="muted" id="clockSub"></div>
      <div class="row" style="margin-top:14px">
        <button class="big ${r.pauseStart ? 'go' : ''}" style="margin:0" onclick="pauseTimer()">${r.pauseStart ? 'Resume' : 'Pause'}</button>
        <button class="big primary" style="margin:0" onclick="stopTimer()">Stop</button>
      </div>
      <div style="margin-top:12px" class="muted small">
        Started <input type="time" class="inline-time" value="${hhmm(new Date(r.start))}" onchange="adjustStart(this.value)">
        &nbsp; <button class="ghost small" onclick="discardTimer()">Discard</button>
      </div>
    </div>`;
  } else {
    const active = data.jobs.filter(j => j.status !== 'Complete');
    if (!active.length) {
      html += `<div class="card center"><p class="muted">No active jobs yet.</p>
        <button class="primary" onclick="jobForm()">+ New job</button></div>`;
    } else {
      if (!active.some(j => j.id === pick.jobId)) { pick.jobId = active[0].id; pick.task = ''; }
      const tasks = tasksFor(pick.jobId);
      if (pick.task !== '__new' && !tasks.includes(pick.task)) pick.task = tasks[0] || '__new';
      const isNew = pick.task === '__new';
      html += `<div class="card">
        <label>Job</label>
        <select id="tJob" onchange="pickJob(this.value)">${active.map(j => `<option value="${esc(j.id)}" ${j.id === pick.jobId ? 'selected' : ''}>${esc(j.name)}</option>`).join('')}</select>
        <label>Task</label>
        <select id="tTask" onchange="pickTask(this.value)">${taskOptions(pick.jobId, pick.task)}</select>
        <input id="tNew" class="${isNew ? '' : 'hidden'}" style="margin-top:8px" placeholder="New task" value="${esc(pick.newTask || '')}" oninput="pick.newTask=this.value;ls.set('tr_pick',pick)">
        <button class="big go" onclick="startTimer()">Start</button>
      </div>`;
    }
  }
  // today
  const today = data.sessions.filter(s => sameDay(new Date(s.start), new Date()))
    .sort((a, b) => new Date(a.start) - new Date(b.start));
  if (today.length) {
    const tw = today.reduce((a, s) => a + s.workedMin, 0), tc = today.reduce((a, s) => a + s.chargedH, 0);
    html += `<div class="card"><h3>Today · ${hm(tw)} worked · ${hrs(tc)} charged</h3><table>
      ${today.map(s => `<tr class="click" onclick="sessionForm('${s.id}')"><td>${hhmm(new Date(s.start))}–${hhmm(new Date(s.end))}</td>
        <td>${esc((jobById(s.jobId) || {}).name || '')}<div class="muted small">${esc(s.task)}</div></td>
        <td class="r">${hrs(s.chargedH)}</td></tr>`).join('')}</table></div>`;
  }
  return html;
}

function pickJob(id) { pick.jobId = id; const t = tasksFor(id); pick.task = t[0] || '__new'; pick.newTask = ''; ls.set('tr_pick', pick); render(); }
function pickTask(v) { pick.task = v; ls.set('tr_pick', pick); $('#tNew').classList.toggle('hidden', v !== '__new'); if (v === '__new') $('#tNew').focus(); }

function jobsView() {
  let jobs = data.jobs.slice();
  if (jobFilter === 'active') jobs = jobs.filter(j => j.status !== 'Complete');
  jobs.sort((a, b) => (a.status === 'Complete') - (b.status === 'Complete') || a.name.localeCompare(b.name));
  let html = `<div class="row" style="align-items:center;margin-bottom:10px">
    <div class="chips" style="margin:0">
      <span class="chip ${jobFilter === 'active' ? 'on' : ''}" onclick="setFilter('active')">Active</span>
      <span class="chip ${jobFilter === 'all' ? 'on' : ''}" onclick="setFilter('all')">All</span>
    </div>
    <div style="text-align:right"><button class="primary" onclick="jobForm()">+ New job</button></div></div>`;
  if (!jobs.length) html += '<p class="muted center">No jobs to show.</p>';
  html += jobs.map(j => {
    const t = totals(j.id);
    return `<div class="job ${j.status === 'Complete' ? 'complete' : ''}" onclick="go('job:${j.id}')">
      <div class="bar"></div><div class="body">
        <div><div class="name">${esc(j.name)}</div><div class="muted small">${esc(j.client || '')}${j.client ? ' · ' : ''}${money(j.rate)}/h</div></div>
        <div class="fig"><b>${money(t.charge)}</b><span class="muted small">${hrs(t.charged)}</span></div>
      </div></div>`;
  }).join('');
  return html;
}
function setFilter(f) { jobFilter = f; ls.set('tr_filter', f); render(); }

function jobView(id) {
  const j = jobById(id);
  if (!j) { setTimeout(() => go('jobs')); return ''; }
  const t = totals(id);
  const ss = data.sessions.filter(s => s.jobId === id).sort((a, b) => new Date(b.start) - new Date(a.start));
  const byTask = {};
  ss.forEach(s => { const k = s.task || '—'; byTask[k] = byTask[k] || { h: 0, c: 0 }; byTask[k].h += s.chargedH; byTask[k].c += s.charge; });
  const complete = j.status === 'Complete';
  let html = `<button class="ghost" onclick="go('jobs')">‹ Jobs</button>
  <div class="card" style="border-left:6px solid ${complete ? 'var(--done)' : 'var(--active)'}">
    <div class="row" style="align-items:flex-start"><div style="flex:3">
      <h2>${esc(j.name)}</h2>
      <div class="muted">${esc(j.client || '')}</div>
      <div class="muted small">${money(j.rate)}/h · <span class="pill ${complete ? 'complete' : ''}">${complete ? 'Complete' : 'Active'}</span></div>
      ${j.notes ? `<div class="small" style="margin-top:6px">${esc(j.notes)}</div>` : ''}
    </div><div style="text-align:right"><button onclick="jobForm('${j.id}')">Edit</button></div></div>
    <div class="stats" style="margin-top:12px">
      <div class="stat"><b>${money(t.charge)}</b><span>Total charge</span></div>
      <div class="stat"><b>${hrs(t.charged)}</b><span>Charged (15 min)</span></div>
      <div class="stat"><b>${hm(t.worked)}</b><span>Actual time worked</span></div>
      <div class="stat"><b>${t.n}</b><span>Sessions</span></div>
    </div>
    <div class="actions">
      <button class="go" onclick="sessionForm(null,'${j.id}')">+ Add time</button>
      <span class="spacer"></span>
      <button onclick="toggleStatus('${j.id}')">${complete ? 'Reopen' : 'Mark complete'}</button>
    </div>
  </div>`;
  if (Object.keys(byTask).length > 1) {
    html += `<div class="card"><h3>By task</h3><table><tr><th>Task</th><th class="r">Hours</th><th class="r">Charge</th></tr>
      ${Object.entries(byTask).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r">${hrs(v.h)}</td><td class="r">${money(v.c)}</td></tr>`).join('')}</table></div>`;
  }
  html += `<div class="card"><h3>Sessions</h3>`;
  if (!ss.length) html += '<p class="muted">No time recorded yet.</p>';
  else html += `<table><tr><th>Date</th><th>Task</th><th class="r">Hours</th><th class="r">£</th></tr>
    ${ss.map(s => { const a = new Date(s.start), b = new Date(s.end); return `<tr class="click" onclick="sessionForm('${s.id}')">
      <td>${a.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: '2-digit' })}<div class="muted small">${hhmm(a)}–${hhmm(b)}</div></td>
      <td>${esc(s.task)}<div class="muted small">${hm(s.workedMin)}${s.pausedMin ? ' (paused ' + Math.round(s.pausedMin) + 'm)' : ''}</div></td>
      <td class="r">${hrs(s.chargedH)}</td><td class="r">${money(s.charge)}</td></tr>`; }).join('')}</table>`;
  html += '</div>';
  return html;
}

function toggleStatus(id) {
  const j = Object.assign({}, jobById(id));
  j.status = j.status === 'Complete' ? 'Active' : 'Complete';
  commit({ type: 'saveJob', job: j });
}

function settingsView() {
  return `<div class="card">
    <label>Apps Script web app URL</label><input id="sUrl" value="${esc(cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec">
    <label>Key</label><input id="sKey" value="${esc(cfg.key)}" autocomplete="off">
    <label>Default hourly rate for new jobs (£)</label><input id="sRate" type="number" step="0.01" inputmode="decimal" value="${data.defaultRate}">
    <div class="actions"><button class="primary" onclick="saveSettings()">Save</button><button onclick="sync()">Sync now</button></div>
  </div>
  <div class="card small muted">
    ${queue.length ? `<p style="color:var(--warn)">${queue.length} change(s) waiting to be sent.</p>` : ''}
    <p>Data is kept in the <a href="${SHEET_URL}" target="_blank">Time Recorder sheet</a> on Google Drive.
    Durations are charged in 15-minute blocks, rounded up per session. Paused time is not counted.</p>
  </div>`;
}

function saveSettings() {
  cfg = { url: $('#sUrl').value.trim(), key: $('#sKey').value.trim() }; ls.set('tr_cfg', cfg);
  const rate = parseFloat($('#sRate').value);
  if (!isNaN(rate) && rate !== data.defaultRate) commit({ type: 'setDefaultRate', rate });
  else sync();
  toast('Settings saved');
}

// ---------- modals ----------
function openModal(html) { $('#modal').innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`; }
function closeModal() { $('#modal').innerHTML = ''; render(); }

function jobForm(id) {
  const j = id ? jobById(id) : { name: '', client: '', rate: data.defaultRate, status: 'Active', notes: '' };
  const n = id ? totals(id).n : 0;
  openModal(`<h2>${id ? 'Edit job' : 'New job'}</h2>
    <label>Job name</label><input id="jName" value="${esc(j.name)}">
    <label>Client</label><input id="jClient" value="${esc(j.client)}">
    <div class="row">
      <div><label>Rate (£/h)</label><input id="jRate" type="number" step="0.01" inputmode="decimal" value="${j.rate}"></div>
      <div><label>Status</label><select id="jStatus"><option ${j.status !== 'Complete' ? 'selected' : ''}>Active</option><option ${j.status === 'Complete' ? 'selected' : ''}>Complete</option></select></div>
    </div>
    <label>Notes</label><textarea id="jNotes">${esc(j.notes)}</textarea>
    ${id && n ? '<p class="muted small">Changing the rate applies to new sessions only. Existing sessions keep the rate they were recorded at.</p>' : ''}
    <div class="actions">
      ${id ? `<button class="danger" onclick="deleteJob('${id}')">Delete</button>` : ''}
      <span class="spacer"></span>
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveJob(${id ? `'${id}'` : ''})">Save</button>
    </div>`);
  if (!id) $('#jName').focus();
}

function saveJob(id) {
  const name = $('#jName').value.trim();
  if (!name) return toast('Enter a job name');
  const job = { id: id || uid('j'), name, client: $('#jClient').value.trim(), rate: parseFloat($('#jRate').value) || 0,
    status: $('#jStatus').value, notes: $('#jNotes').value.trim() };
  $('#modal').innerHTML = '';
  commit({ type: 'saveJob', job });
  if (!id) { pick = { jobId: job.id, task: '', newTask: '' }; ls.set('tr_pick', pick); go('job:' + job.id); }
}

function deleteJob(id) {
  const j = jobById(id), n = totals(id).n;
  if (!confirm(`Delete "${j.name}"${n ? ' and its ' + n + ' session(s)' : ''}? This cannot be undone.\n\nTo keep the record, cancel and mark the job Complete instead.`)) return;
  $('#modal').innerHTML = '';
  commit({ type: 'deleteJob', id });
  go('jobs');
}

let editing = null;
function sessionForm(id, jobId) {
  const s = id ? data.sessions.find(x => x.id === id) : null;
  const now = new Date();
  const jobs = data.jobs.slice().sort((a, b) => (a.status === 'Complete') - (b.status === 'Complete') || a.name.localeCompare(b.name));
  if (!jobs.length) { toast('Create a job first'); return jobForm(); }
  jobId = s ? s.jobId : (jobId || (view.startsWith('job:') ? view.slice(4) : '') || pick.jobId || jobs[0].id);
  const job = jobById(jobId) || jobs[0];
  const start = s ? new Date(s.start) : new Date(now.getTime() - 60 * 60000);
  const end = s ? new Date(s.end) : now;
  editing = s ? { id: s.id, start: s.start, end: s.end } : null;
  openModal(`<h2>${s ? 'Edit time' : 'Add time'}</h2>
    <label>Job</label><select id="mJob" onchange="mJobChanged()">${jobs.map(j => `<option value="${esc(j.id)}" ${j.id === job.id ? 'selected' : ''}>${esc(j.name)}${j.status === 'Complete' ? ' (complete)' : ''}</option>`).join('')}</select>
    <label>Task</label><select id="mTask" onchange="mTaskChanged()">${taskOptions(job.id, s ? s.task : (tasksFor(job.id)[0] || ''))}</select>
    <input id="mNew" class="hidden" style="margin-top:8px" placeholder="New task">
    <label>Date</label><input id="mDate" type="date" value="${ymd(start)}" oninput="mCalc()">
    <div class="row">
      <div><label>Start</label><input id="mStart" type="time" value="${hhmm(start)}" oninput="mCalc()"></div>
      <div><label>End</label><input id="mEnd" type="time" value="${hhmm(end)}" oninput="mCalc()"></div>
    </div>
    <div class="row">
      <div><label>Paused (min)</label><input id="mPaused" type="number" min="0" step="1" inputmode="numeric" value="${s ? Math.round(s.pausedMin) : 0}" oninput="mCalc()"></div>
      <div><label>Rate (£/h)</label><input id="mRate" type="number" step="0.01" inputmode="decimal" value="${s ? s.rate : job.rate}" oninput="mCalc()"></div>
    </div>
    <label>Notes</label><textarea id="mNotes">${esc(s ? s.notes : '')}</textarea>
    <div class="calc" id="mCalc"></div>
    <div class="actions">
      ${s ? `<button class="danger" onclick="deleteSession('${s.id}')">Delete</button>` : ''}
      <span class="spacer"></span>
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveSession()">Save</button>
    </div>`);
  mTaskChanged(); mCalc();
}

function mJobChanged() {
  const j = jobById($('#mJob').value);
  $('#mTask').innerHTML = taskOptions(j.id, tasksFor(j.id)[0] || '');
  if (!editing) $('#mRate').value = j.rate;
  mTaskChanged(); mCalc();
}
function mTaskChanged() { $('#mNew').classList.toggle('hidden', $('#mTask').value !== '__new'); }

function mTimes() {
  const date = $('#mDate').value, st = $('#mStart').value, en = $('#mEnd').value;
  if (!date || !st || !en) return null;
  const [y, mo, d] = date.split('-').map(Number);
  const [sh, sm] = st.split(':').map(Number), [eh, em] = en.split(':').map(Number);
  let start = new Date(y, mo - 1, d, sh, sm), end = new Date(y, mo - 1, d, eh, em);
  if (end <= start) end.setDate(end.getDate() + 1);   // runs past midnight
  // keep the exact recorded seconds if the times were not changed
  if (editing) {
    const os = new Date(editing.start), oe = new Date(editing.end);
    if (ymd(os) === date && hhmm(os) === st) start = os;
    if (hhmm(oe) === en && Math.abs(oe - end) < 60000) end = oe;
  }
  return { start, end };
}

function mCalc() {
  const t = mTimes(); if (!t) return;
  const d = derive({ start: t.start, end: t.end, pausedMin: parseFloat($('#mPaused').value) || 0, rate: parseFloat($('#mRate').value) || 0 });
  $('#mCalc').innerHTML = `Worked ${hm(d.workedMin)} → charged <b>${hrs(d.chargedH)}</b> = <b>${money(d.charge)}</b>`;
}

function saveSession() {
  const t = mTimes(); if (!t) return toast('Enter the date and times');
  let task = $('#mTask').value === '__new' ? $('#mNew').value.trim() : $('#mTask').value;
  if (!task) task = 'General';
  const s = {
    id: editing ? editing.id : uid('s'), jobId: $('#mJob').value, task,
    start: t.start.toISOString(), end: t.end.toISOString(),
    pausedMin: parseFloat($('#mPaused').value) || 0, rate: parseFloat($('#mRate').value) || 0,
    notes: $('#mNotes').value.trim()
  };
  $('#modal').innerHTML = '';
  commit({ type: 'saveSession', session: s });
  toast('Saved');
}

function deleteSession(id) {
  if (!confirm('Delete this session? This cannot be undone.')) return;
  $('#modal').innerHTML = '';
  commit({ type: 'deleteSession', id });
}

// ---------- clock ----------
function tick() {
  const r = data.running, c = $('#clock'); if (!r || !c) return;
  c.textContent = fmtClock(elapsedMs(r));
  const pausedMin = Math.round(((r.pausedMs || 0) + (r.pauseStart ? Date.now() - new Date(r.pauseStart) : 0)) / 60000);
  const sub = $('#clockSub');
  if (sub) sub.textContent = r.pauseStart ? 'Paused since ' + hhmm(new Date(r.pauseStart)) + (pausedMin ? ' · ' + pausedMin + ' min paused in total' : '')
    : (pausedMin ? pausedMin + ' min paused' : '');
}
setInterval(tick, 1000);

// ---------- start ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  if (b.dataset.nav === 'add') return sessionForm();
  go(b.dataset.nav);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
window.addEventListener('online', sync);
if (!cfg.url || !cfg.key) view = 'settings';
render();
sync();
</script>
</body>
</html>
